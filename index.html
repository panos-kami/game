<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181529">
<title>Mission: Find Your Boyfriend — Kami & Panagiotis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800;900&display=swap');
:root{--bg:#181529;--panel:#29243f;--inner:#19172e;--line:#8577ad;--pink:#ff80b7;--yellow:#ffdc80;--mint:#84edc4;--white:#fff8f3}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100dvh;color:var(--white);font:16px/1.55 Nunito,system-ui,sans-serif;background:radial-gradient(ellipse at top right,#423358,transparent 55%),var(--bg)}button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:not-allowed}.pixel{font-family:'Press Start 2P',monospace;line-height:1.65;overflow-wrap:anywhere}
#app{width:min(100%,650px);margin:auto;padding:16px 14px calc(32px + env(safe-area-inset-bottom))}.top,.hud,.score{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{margin-bottom:12px}.top strong{color:var(--yellow);font-size:10px}.sound{color:white;background:var(--panel);border:2px solid var(--line);padding:9px;border-radius:5px;font-size:12px}.screen{padding:clamp(16px,5vw,28px);min-height:520px;background:var(--panel);border:3px solid var(--line);border-radius:5px;box-shadow:6px 6px #0f0e1d;overflow:hidden}.hud{font-size:11px}.hud .pixel{font-size:9px;color:var(--mint)}.bar{height:12px;border:2px solid var(--line);background:var(--inner);margin:10px 0 20px}.fill{display:block;background:linear-gradient(90deg,var(--pink),var(--yellow));height:100%;transition:width .25s}.tag{display:inline-block;padding:5px 8px;font-size:9px;color:var(--bg);background:var(--mint);margin:0 0 13px}.heading{color:var(--yellow);font-size:clamp(17px,5vw,26px);margin:5px 0 12px}.sub{color:var(--pink);font-size:10px;margin:0 0 15px}.center{text-align:center}.small{font-size:13px}.muted{color:#d0c7df}.notice{background:var(--inner);border-left:4px solid var(--pink);padding:11px;margin:14px 0;font-size:14px}.btn{width:100%;min-height:52px;display:block;margin:11px 0;padding:12px;background:var(--yellow);color:#20172f;border:0;border-bottom:5px solid #a88239;border-radius:4px;font-weight:900}.btn:active{transform:translateY(3px);border-bottom-width:2px}.pink{background:var(--pink);border-bottom-color:#a94677}.mint{background:var(--mint);border-bottom-color:#398f75}.secondary{background:#514768;border-bottom-color:#30253f;color:white}.choices{display:grid;gap:9px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:64px;padding:11px 8px;color:white;background:#38314f;border:2px solid var(--line);border-bottom-width:5px;border-radius:5px;font-weight:800;overflow-wrap:anywhere}.choice.selected{background:#24544c;border-color:var(--mint)}.choice.wrong{background:#633145;border-color:var(--pink)}.choice .emoji{display:block;font-size:31px}.choice .label{display:block;font-size:12px}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}.photo-card{margin:0;background:#fff5e6;padding:6px 6px 9px;color:#282033;box-shadow:3px 4px #0c0a19;transform:rotate(-2deg)}.photo-card:nth-child(2n){transform:rotate(2deg)}.photo-card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9cfe2}.photo-card figcaption{text-align:center;font-size:11px;font-weight:900;margin-top:7px}.photo-card.wide{grid-column:span 2}.photo-card.wide img{aspect-ratio:4/3;max-height:310px}.world{padding:15px 8px;border:2px dashed var(--line);background:var(--inner);text-align:center;margin:15px 0;font-size:13px}.arena{position:relative;height:290px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(#141629,#343051);touch-action:manipulation}.fall{position:absolute;transform:translate(-50%,-50%);padding:11px;border:0;background:none;font-size:30px;line-height:1}.score{font-size:13px;font-weight:900;margin:12px 0}.request{padding:14px;background:var(--inner);border:2px dashed var(--yellow);margin:15px 0}.request-title{font-size:10px;color:var(--yellow);text-align:center}.check{display:flex;gap:10px;align-items:flex-start;background:#37304e;border:2px solid var(--line);padding:12px;margin:9px 0;border-radius:4px}.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--pink)}.check strong{display:block}.check span{display:block;font-size:12px;color:#d0c7df}.field{display:block;width:100%;min-height:100px;margin:10px 0;padding:12px;background:var(--inner);color:white;border:2px solid var(--line);border-radius:4px;resize:vertical}.footer{margin:18px 0;text-align:center;color:#b9afcb;font-size:11px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}.confetti i{position:absolute;top:-30px;width:9px;height:15px;animation:rain 3s linear forwards}@keyframes rain{to{transform:translateY(110vh) rotate(650deg)}}@media(max-width:350px){.two{grid-template-columns:1fr}.screen{padding:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
<header class="top"><strong class="pixel">♥ KAMI.EXE</strong><button id="sound" class="sound" type="button">♪ SOUND ON</button></header>
<main id="screen" class="screen" aria-live="polite"></main>
<p class="footer">MADE FOR KAMI · BY PANAGIOTIS · 0% SERIOUS</p>
</div><div id="confetti" class="confetti" aria-hidden="true"></div>
<script>
'use strict';
// Keep these four JPEGs next to this HTML file, with EXACTLY these names.
const PHOTOS=[
  {file:'IMG_3435.jpeg',caption:'Kami & Panagiotis · sunshine'},
  {file:'IMG_9278.jpeg',caption:'Kami & Panagiotis · kiss attack'},
  {file:'IMG_9302.jpeg',caption:'Kami & Panagiotis · night mode'},
  {file:'IMG_9384.jpeg',caption:'Kami & Panagiotis · another adventure'}
];
const KEY='kami-panagiotis-pixel-mission-v2';
const screen=document.getElementById('screen');
const names=['START','PACK','QUIZ','MAP','ARCADE','SECRET'];
const fresh=()=>({stage:0,packed:[],question:0,visited:[],hearts:0,flags:0,wishes:[],message:''});
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.stage)&&saved.stage>=0&&saved.stage<=5)state={...fresh(),...saved}}catch(e){}
let sound=true,ctx=null,spawnId=null,moveId=null,items=[],playing=false;
const $=selector=>document.querySelector(selector);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function beep(f=600,d=.09){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='square';osc.frequency.value=f;gain.gain.setValueAtTime(.025,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+d)}catch(e){}}
function winSound(){[523,660,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,.13),i*115))}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='♪ SOUND '+(sound?'ON':'OFF');if(sound)beep()};
function stopArcade(){clearInterval(spawnId);clearInterval(moveId);spawnId=moveId=null;items.forEach(item=>item.el.remove());items=[];playing=false}
function go(stage){stopArcade();state.stage=stage;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function page(tag,title,subtitle,body){screen.innerHTML=`<div class="hud"><span class="pixel">${names[state.stage]}</span><span>${state.stage*20}% COMPLETE</span></div><div class="bar"><span class="fill" style="width:${state.stage*20}%"></span></div><span class="tag pixel">${tag}</span><h1 class="heading pixel">${title}</h1><p class="sub pixel">${subtitle}</p>${body}`}
function add(label,action,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=()=>{beep();action()};screen.append(b);return b}
function gallery(indexes){return '<div class="photos">'+indexes.map(i=>`<figure class="photo-card ${indexes.length===1?'wide':''}"><img src="${PHOTOS[i].file}" alt="Kami and Panagiotis together" loading="lazy"><figcaption>${PHOTOS[i].caption}</figcaption></figure>`).join('')+'</div>'}
function render(){if(state.stage===0)return intro();if(state.stage===1)return packing();if(state.stage===2)return quiz();if(state.stage===3)return map();if(state.stage===4)return arcade();return finale()}
function intro(){page('CLASSIFIED // 001','FIND YOUR<br>BOYFRIEND','AGENT KAMI, YOU HAVE A MISSION',`<p>Your boyfriend has disappeared somewhere between <b>three continents</b>, Japan, and approximately 999 travel ideas.</p>${gallery([1,3])}<div class="notice">⚠️ Mission difficulty: emotionally suspicious. Complete four levels to unlock what this is REALLY about.</div><p class="small muted">Featuring: Kami, Panagiotis, questionable jokes, and a fourth continent coming in October.</p>`);add('▶ START MISSION',()=>go(1),'pink');add('↻ START FROM ZERO',()=>{if(confirm('Erase your saved progress and restart?')){state=fresh();go(0)}},'secondary')}
const packItems=[['🛂','Passport',true],['📱','Phone',true],['💗','Proof you care',true],['🧱','A random brick',false],['🧦','One lonely sock',false],['🦖','A dinosaur',false]];
function packing(note=''){page('LEVEL 01 / 04','PACK YOUR BAG','THREE ITEMS. ONE MISSION.',`<p>Before crossing another continent, pack the <b>three</b> things you actually need.</p><div class="choices two" id="packing"></div><div class="notice" id="pack-note">${note||'Packed: '+state.packed.length+'/3'}</div>`);packItems.forEach(([emoji,label,correct],i)=>{const b=document.createElement('button');b.className='choice'+(state.packed.includes(i)?' selected':'');b.innerHTML=`<span class="emoji">${emoji}</span><span class="label">${label}</span>`;b.onclick=()=>{if(!correct){beep(170,.16);$('#pack-note').textContent='Customs confiscated that. Try something less suspicious. 🤨';b.classList.add('wrong');return}if(!state.packed.includes(i)){state.packed.push(i);beep(850);save()}b.classList.add('selected');$('#pack-note').textContent='Packed: '+state.packed.length+'/3';if(state.packed.length===3&&!$('#pack-next'))addNext()};$('#packing').append(b)});if(state.packed.length===3)addNext();function addNext(){add('✓ BAG READY — NEXT LEVEL',()=>go(2),'mint').id='pack-next'}}
const questions=[
{q:'How many continents have we met on so far?',a:['Two. We are homebodies.','Three. International chaos.','Seven. Please stop.'],correct:1,good:'Correct. October is bringing continent number FOUR. 🌍'},
{q:'What annoys Panagiotis the most?',a:['When you do not show him you care.','When you steal his imaginary dinosaur.','When you are too cute.'],correct:0,good:'Correct. Secret cheat code: little reminders that you care. 💗'},
{q:'Which place belongs in our memory vault?',a:['The Moon','Japan','A secret underwater kingdom'],correct:1,good:'Japan memory unlocked. 🗾'}
];
function quiz(note=''){if(state.question===questions.length){page('LEVEL 02 / 04','MEMORY MASTER!','ALL QUESTIONS CLEARED',`<p class="center">🏆 You know your boyfriend better than the game does.</p>${gallery([0])}`);add('OPEN THE WORLD MAP →',()=>go(3),'mint');return}const q=questions[state.question];page('LEVEL 02 / 04',`QUESTION ${state.question+1}/3`,'RELATIONSHIP KNOWLEDGE TEST',`<p><b>${q.q}</b></p><div class="choices" id="answers"></div><div class="notice" id="answer-note">${note||'Choose wisely, Agent Kami.'}</div>`);q.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{if(i!==q.correct){beep(170,.15);b.classList.add('wrong');$('#answer-note').textContent='Nice try. The boyfriend department requests another attempt. 😏';return}beep(880,.14);b.classList.add('selected');[...$('#answers').children].forEach(btn=>btn.disabled=true);$('#answer-note').textContent='✓ '+q.good;state.question++;save();setTimeout(()=>quiz(),1100)};$('#answers').append(b)})}
const paths=[['🗾 JAPAN','Memory unlocked: Japan. Another page in our adventure book.'],['🇲🇦 MOROCCO','Coming in October: our FOURTH continent. New memories loading…'],['🌀 SECRET PORTAL','Coordinates missing. Destination: wherever we end up laughing together.']];
function map(){page('LEVEL 03 / 04','WORLD MAP','EXPLORE ALL THREE PORTALS',`<div class="world">🌍 3 CONTINENTS &nbsp; → &nbsp; 🧳 OCTOBER &nbsp; → &nbsp; 🌍 4</div><p>Each portal holds one clue. Visit all three to unlock the arcade.</p><div id="paths" class="choices"></div><div id="path-note" class="notice">Portals explored: ${state.visited.length}/3</div>${gallery([2])}`);paths.forEach(([label,text],i)=>{const b=document.createElement('button');b.className='choice'+(state.visited.includes(i)?' selected':'');b.textContent=label+(state.visited.includes(i)?' ✓':'');b.onclick=()=>{if(!state.visited.includes(i)){state.visited.push(i);save();beep(770)}b.classList.add('selected');b.textContent=label+' ✓';$('#path-note').textContent=text+' ('+state.visited.length+'/3)';if(state.visited.length===3&&!$('#map-next'))add('ENTER HEART ARCADE →',()=>go(4),'mint').id='map-next'};$('#paths').append(b)});if(state.visited.length===3)add('ENTER HEART ARCADE →',()=>go(4),'mint').id='map-next'}
function arcade(){state.hearts=0;state.flags=0;page('LEVEL 04 / 04','CATCH THE CARE','TAP HEARTS. DODGE RED FLAGS.',`<p>Collect <b>8 hearts</b> to unlock the secret file. Tap the falling 💗, but avoid 🚩. Unlimited retries, zero judgment.</p><div class="score"><span id="hearts">💗 0/8</span><span id="flags">🚩 0</span></div><div id="arena" class="arena" aria-label="Heart-catching game"></div><div id="arcade-note" class="notice">Press START to play.</div>`);add('▶ START ARCADE',startArcade,'pink').id='start-arcade'}
function startArcade(){if(playing)return;playing=true;$('#start-arcade').disabled=true;$('#arcade-note').textContent='Catch the hearts!';const arena=$('#arena');let count=0;function spawn(){if(!playing)return;const bad=Math.random()<.23;const el=document.createElement('button');el.type='button';el.className='fall';el.textContent=bad?'🚩':'💗';el.setAttribute('aria-label',bad?'Avoid red flag':'Catch heart');const obj={id:++count,el,y:-20,speed:1.6+Math.random()*1.5};el.style.left=(10+Math.random()*80)+'%';el.style.top='-20px';items.push(obj);el.onclick=()=>{if(!playing)return;if(bad){state.flags++;state.hearts=Math.max(0,state.hearts-1);beep(150,.16);$('#arcade-note').textContent='🚩 Oops! A red flag stole a heart.'}else{state.hearts++;beep(530+state.hearts*55);$('#arcade-note').textContent='💗 Care successfully received!'}el.remove();items=items.filter(item=>item!==obj);$('#hearts').textContent='💗 '+state.hearts+'/8';$('#flags').textContent='🚩 '+state.flags;if(state.hearts>=8){stopArcade();winSound();$('#arena').innerHTML='<div class="center" style="font-size:76px;padding:70px 0">🏆</div>';$('#arcade-note').textContent='MISSION COMPLETE. Your secret file is ready.';$('#start-arcade').remove();add('🔓 UNLOCK SECRET FILE',()=>go(5),'mint')}};arena.append(el)}spawn();spawnId=setInterval(spawn,800);moveId=setInterval(()=>{if(!playing)return;for(const obj of [...items]){obj.y+=obj.speed*1.5;obj.el.style.top=obj.y+'px';if(obj.y>320){obj.el.remove();items=items.filter(item=>item!==obj)}}},40)}
const wishes=[['Show me you care','Little reminders, even on ordinary days. 💗'],['Spend more time with me','Even doing absolutely nothing counts. 🫂'],['Plan another adventure','Japan memories, Morocco dreams, and whatever comes next. ✈️'],['Surprise me sometimes','Something small, silly, or ridiculously romantic. 🎁'],['Make me laugh','Yes, even with terrible boyfriend jokes. 👾'],['My own secret request','I have something else in mind. ✍️']];
function finale(){page('SECRET FILE / UNLOCKED','PLOT TWIST!','THE FINAL BOSS IS… COMMUNICATION',`<p class="center"><span style="font-size:52px">🎮💌</span><br><b>YOU FOUND PANAGIOTIS!</b><br>But he has one question for you…</p><div class="request"><p class="pixel request-title">WHAT DO YOU WANT FROM ME?</p><p class="small center">Select as many answers as you like. No wrong answers. No pressure.</p></div><div id="wishes"></div><label for="message"><b>Bonus level:</b> Tell Panagiotis something in your own words (optional).</label><textarea id="message" class="field" maxlength="600" placeholder="I wish you would… / I love it when you…"></textarea>${gallery([0,1,2,3])}<div class="notice" id="share-note">Nothing is sent automatically. You'll choose whether to share your answers.</div>`);const list=$('#wishes');wishes.forEach(([title,desc],i)=>{const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=state.wishes.includes(i);input.onchange=()=>{state.wishes=input.checked?[...new Set([...state.wishes,i])]:state.wishes.filter(x=>x!==i);save();beep(700)};const words=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('span');small.textContent=desc;words.append(strong,small);label.append(input,words);list.append(label)});$('#message').value=state.message;$('#message').oninput=e=>{state.message=e.target.value;save()};add('💌 GENERATE MY REQUEST',showRequest,'pink');add('↻ PLAY AGAIN',()=>{if(confirm('Reset everything, including your answers?')){state=fresh();go(0)}},'secondary')}
function resultText(){const selected=state.wishes.map(i=>'• '+wishes[i][0]);return `MISSION COMPLETE 👾💗\nDear Panagiotis,\n\nHere is what I want from you:\n${selected.length?selected.join('\n'):'I am keeping you guessing 😏'}${state.message.trim()?'\n\nBonus request: '+state.message.trim():''}\n\n— Agent Kami 🕹️`}
function showRequest(){if(!state.wishes.length&&!state.message.trim()){$('#share-note').textContent='Select an option or write your own request first. 💗';beep(180,.15);return}winSound();confetti();$('#result')?.remove();const section=document.createElement('section');section.id='result';section.className='request';const heading=document.createElement('h2');heading.className='pixel';heading.style.cssText='font-size:12px;color:var(--mint)';heading.textContent='REQUEST UNLOCKED!';const text=document.createElement('p');text.style.whiteSpace='pre-wrap';text.style.overflowWrap='anywhere';text.textContent=resultText();section.append(heading,text);screen.append(section);add('📤 SHARE WITH PANAGIOTIS',share,'mint');add('📋 COPY MY ANSWERS',copy,'secondary');$('#share-note').textContent='Tap SHARE and choose your chat, or COPY and paste the text. Nothing is sent automatically.';section.scrollIntoView({behavior:'smooth',block:'center'})}
async function copy(){try{await navigator.clipboard.writeText(resultText());$('#share-note').textContent='Copied! Paste it into your chat with Panagiotis. 💌'}catch(e){const t=document.createElement('textarea');t.value=resultText();document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();$('#share-note').textContent=ok?'Copied! Paste it into your chat. 💌':'Select and copy the text from the request box.'}}
async function share(){if(navigator.share){try{await navigator.share({title:'My Boyfriend Mission Results',text:resultText()});return}catch(e){if(e.name==='AbortError')return}}await copy()}
function confetti(){const root=$('#confetti');root.innerHTML='';for(let i=0;i<40;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#ff80b7','#ffdc80','#84edc4'][i%3];e.style.animationDelay=Math.random()*.5+'s';root.append(e)}setTimeout(()=>root.innerHTML='',4000)}
render();
</script>
</body>
</html>
