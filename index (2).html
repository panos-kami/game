nt-size:13px}.arena{position:relative;height:290px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(#141629,#343051);touch-action:manipulation}.fall{position:absolute;transform:translate(-50%,-50%);padding:11px;border:0;background:none;font-size:30px;line-height:1}.score{font-size:13px;font-weight:900;margin:12px 0}.request{padding:14px;background:var(--inner);border:2px dashed var(--yellow);margin:15px 0}.request-title{font-size:10px;color:var(--yellow);text-align:center}.check{display:flex;gap:10px;align-items:flex-start;background:#37304e;border:2px solid var(--line);padding:12px;margin:9px 0;border-radius:4px}.check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--pink)}.check strong{display:block}.check span{display:block;font-size:12px;color:#d0c7df}.field{display:block;width:100%;min-height:100px;margin:10px 0;padding:12px;background:var(--inner);color:white;border:2px solid var(--line);border-radius:4px;resize:vertical}.footer{margin:18px 0;text-align:center;color:#b9afcb;font-size:11px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}.confetti i{position:absolute;top:-30px;width:9px;height:15px;animation:rain 3s linear forwards}@keyframes rain{to{transform:translateY(110vh) rotate(650deg)}}@media(max-width:350px){.two{grid-template-columns:1fr}.screen{padding:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function beep(f=600,d=.09){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='square';osc.frequency.value=f;gain.gain.setValueAtTime(.025,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+d)}catch(e){}}
function winSound(){[523,660,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,.13),i*115))}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='♪ SOUND '+(sound?'ON':'OFF');if(sound)beep()};
function stopArcade(){clearInterval(spawnId);clearInterval(moveId);spawnId=moveId=null;items.forEach(item=>item.el.remove());items=[];playing=false}
function go(stage){stopArcade();state.stage=stage;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function page(tag,title,subtitle,body){screen.innerHTML=`<div class="hud"><span class="pixel">${names[state.stage]}</span><span>${Math.round(state.stage/6*100)}% COMPLETE</span></div><div class="bar"><span class="fill" style="width:${Math.round(state.stage/6*100)}%"></span></div><span class="tag pixel">${tag}</span><h1 class="heading pixel">${title}</h1><p class="sub pixel">${subtitle}</p>${body}`}
function add(label,action,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=()=>{beep();action()};screen.append(b);return b}
function gallery(indexes){return '<div class="photos">'+indexes.map(i=>`<figure class="photo-card ${indexes.length===1?'wide':''}"><img src="${PHOTOS[i].file}" alt="Kami and Panagiotis together" loading="lazy"><figcaption>${PHOTOS[i].caption}</figcaption></figure>`).join('')+'</div>'}
function render(){if(state.stage===0)return intro();if(state.stage===1)return packing();if(state.stage===2)return quiz();if(state.stage===3)return map();if(state.stage===4)return arcade();if(state.stage===5)return maze();return finale()}
function intro(){page('CLASSIFIED // 001','FIND YOUR<br>BOYFRIEND','AGENT KAMI, YOU HAVE A MISSION',`<p>Your boyfriend has disappeared somewhere between <b>three continents</b>, the next trip, and approximately 999 travel ideas.</p>${gallery([1,3])}<div class="notice">⚠️ Mission difficulty: emotionally suspicious. Complete five levels to unlock what this is REALLY about.</div><p class="small muted">Featuring: Kami, Panagiotis, questionable jokes, and a fourth continent coming in October.</p>`);add('▶ START MISSION',()=>go(1),'pink');add('↻ START FROM ZERO',()=>{if(confirm('Erase your saved progress and restart?')){state=fresh();go(0)}},'secondary')}
const packItems=[['🛂','Passport',true],['📱','Phone',true],['💗','Proof you care',true],['🧱','A random brick',false],['🧦','One lonely sock',false],['🦖','A dinosaur',false]];
function packing(note=''){page('LEVEL 01 / 05','PACK YOUR BAG','THREE ITEMS. ONE MISSION.',`<p>Before crossing another continent, pack the <b>three</b> things you actually need.</p><div class="choices two" id="packing"></div><div class="notice" id="pack-note">${note||'Packed: '+state.packed.length+'/3'}</div>`);packItems.forEach(([emoji,label,correct],i)=>{const b=document.createElement('button');b.className='choice'+(state.packed.includes(i)?' selected':'');b.innerHTML=`<span class="emoji">${emoji}</span><span class="label">${label}</span>`;b.onclick=()=>{if(!correct){beep(170,.16);$('#pack-note').textContent='Customs confiscated that. Try something less suspicious. 🤨';b.classList.add('wrong');return}if(!state.packed.includes(i)){state.packed.push(i);beep(850);save()}b.classList.add('selected');$('#pack-note').textContent='Packed: '+state.packed.length+'/3';if(state.packed.length===3&&!$('#pack-next'))addNext()};$('#packing').append(b)});if(state.packed.length===3)addNext();function addNext(){add('✓ BAG READY — NEXT LEVEL',()=>go(2),'mint').id='pack-next'}}
const questions=[
{q:'How many continents have we met on so far?',a:['Two. We are homebodies.','Three. International chaos.','Seven. Please stop.'],correct:1,good:'Correct. October is bringing continent number FOUR. 🌍'},
{q:'What annoys Panagiotis the most?',a:['When you do not show him you care.','When you steal his imaginary dinosaur.','When you are too cute.'],correct:0,good:'Correct. Secret cheat code: little reminders that you care. 💗'},
{q:'Where is our next adventure in October?',a:['The Moon','Morocco','A secret underwater kingdom'],correct:1,good:'Morocco confirmed as the NEXT adventure. 🇲🇦'}
];
function quiz(note=''){if(state.question===questions.length){page('LEVEL 02 / 05','MEMORY MASTER!','ALL QUESTIONS CLEARED',`<p class="center">🏆 You know your boyfriend better than the game does.</p>${gallery([0])}`);add('OPEN THE WORLD MAP →',()=>go(3),'mint');return}const q=questions[state.question];page('LEVEL 02 / 04',`QUESTION ${state.question+1}/3`,'RELATIONSHIP KNOWLEDGE TEST',`<p><b>${q.q}</b></p><div class="choices" id="answers"></div><div class="notice" id="answer-note">${note||'Choose wisely, Agent Kami.'}</div>`);q.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{if(i!==q.correct){beep(170,.15);b.classList.add('wrong');$('#answer-note').textContent='Nice try. The boyfriend department requests another attempt. 😏';return}beep(880,.14);b.classList.add('selected');[...$('#answers').children].forEach(btn=>btn.disabled=true);$('#answer-note').textContent='✓ '+q.good;state.question++;save();setTimeout(()=>quiz(),1100)};$('#answers').append(b)})}
const paths=[['🗺️ MEMORY VAULT','Three continents down. No, we are not collecting frequent-flyer miles fast enough.'],['🇲🇦 MOROCCO','Coming in October: continent number FOUR. Next adventure loading…'],['🔒 DREAM PORTAL','Coordinates encrypted. Finish both arcade missions to unlock our biggest dream.']];
function map(){page('LEVEL 03 / 05','WORLD MAP','EXPLORE ALL THREE PORTALS',`<div class="world">🌍 3 CONTINENTS &nbsp; → &nbsp; 🧳 OCTOBER &nbsp; → &nbsp; 🌍 4</div><p>Each portal holds one clue. Visit all three to unlock the arcade.</p><div id="paths" class="choices"></div><div id="path-note" class="notice">Portals explored: ${state.visited.length}/3</div>${gallery([2])}`);paths.forEach(([label,text],i)=>{const b=document.createElement('button');b.className='choice'+(state.visited.includes(i)?' selected':'');b.textContent=label+(state.visited.includes(i)?' ✓':'');b.onclick=()=>{if(!state.visited.includes(i)){state.visited.push(i);save();beep(770)}b.classList.add('selected');b.textContent=label+' ✓';$('#path-note').textContent=text+' ('+state.visited.length+'/3)';if(state.visited.length===3&&!$('#map-next'))add('ENTER HEART ARCADE →',()=>go(4),'mint').id='map-next'};$('#paths').append(b)});if(state.visited.length===3)add('ENTER HEART ARCADE →',()=>go(4),'mint').id='map-next'}
function arcade(){state.hearts=0;state.flags=0;page('LEVEL 04 / 05','CATCH THE CARE','TAP HEARTS. DODGE RED FLAGS.',`<p>Collect <b>8 hearts</b> to unlock the secret file. Tap the falling 💗, but avoid 🚩. Unlimited retries, zero judgment.</p><div class="score"><span id="hearts">💗 0/8</span><span id="flags">🚩 0</span></div><div id="arena" class="arena" aria-label="Heart-catching game"></div><div id="arcade-note" class="notice">Press START to play.</div>`);add('▶ START ARCADE',startArcade,'pink').id='start-arcade'}
function startArcade(){if(playing)return;playing=true;$('#start-arcade').disabled=true;$('#arcade-note').textContent='Catch the hearts!';const arena=$('#arena');let count=0;function spawn(){if(!playing)return;const bad=Math.random()<.23;const el=document.createElement('button');el.type='button';el.className='fall';el.textContent=bad?'🚩':'💗';el.setAttribute('aria-label',bad?'Avoid red flag':'Catch heart');const obj={id:++count,el,y:-20,speed:1.6+Math.random()*1.5};el.style.left=(10+Math.random()*80)+'%';el.style.top='-20px';items.push(obj);el.onclick=()=>{if(!playing)return;if(bad){state.flags++;state.hearts=Math.max(0,state.hearts-1);beep(150,.16);$('#arcade-note').textContent='🚩 Oops! A red flag stole a heart.'}else{state.hearts++;beep(530+state.hearts*55);$('#arcade-note').textContent='💗 Care successfully received!'}el.remove();items=items.filter(item=>item!==obj);$('#hearts').textContent='💗 '+state.hearts+'/8';$('#flags').textContent='🚩 '+state.flags;if(state.hearts>=8){stopArcade();winSound();$('#arena').innerHTML='<div class="center" style="font-size:76px;padding:70px 0">🏆</div>';$('#arcade-note').textContent='MISSION COMPLETE. Your secret file is ready.';$('#start-arcade').remove();add('🔓 UNLOCK SECRET FILE',()=>go(5),'mint')}};arena.append(el)}spawn();spawnId=setInterval(spawn,800);moveId=setInterval(()=>{if(!playing)return;for(const obj of [...items]){obj.y+=obj.speed*1.5;obj.el.style.top=obj.y+'px';if(obj.y>320){obj.el.remove();items=items.filter(item=>item!==obj)}}},40)}
// A distinct second mini-game: explore a 6×6 labyrinth with swipe / D-pad / arrow keys.
// # = wall, S = start, 1/2/3 = passport stamps, J = dream gate.
const mazeMap=['S..#.1','##.#..','2....#','.###..','....#.','##3..J'];
const stampLabels={'1':'NEON','2':'RAMEN','3':'ADVENTURE'};
const japanChoices=['🎮 Tokyo arcades & neon lights','🍜 Eat all the ramen','⛩️ Get lost together in Kyoto','🎲 Surprise me — you choose'];
function maze(){
 const pos=Array.isArray(state.mazePos)&&state.mazePos.length===2?state.mazePos:[0,0];
 state.mazePos=pos;
 page('LEVEL 05 / 05','PASSPORT QUEST','FIND THE SECRET DREAM GATE',`<p>A new kind of game! Move through the maze and collect <b>3 passport stamps</b>. The golden gate opens only when you have them all.</p><div class="score"><span id="stamp-score">🛂 ${state.stamps.length}/3 STAMPS</span><span>🗾 DREAM MODE</span></div><div id="maze-board" class="maze-board" role="group" aria-label="Interactive maze. Swipe or use arrow buttons to move."></div><div class="dpad"><span></span><button type="button" data-dir="up" aria-label="Move up">▲</button><span></span><button type="button" data-dir="left" aria-label="Move left">◀</button><button type="button" data-dir="down" aria-label="Move down">▼</button><button type="button" data-dir="right" aria-label="Move right">▶</button></div><p id="maze-note" class="notice" role="status">${state.mazeWon?'Dream gate unlocked!':'Swipe the board or use the arrows. No timer. No stress. Just adventure.'}</p><p class="small muted center">Tip: keyboard arrow keys work too. The black squares are walls.</p>`);
 drawMaze();
 screen.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{beep(420,.05);moveMaze(b.dataset.dir)});
 const board=$('#maze-board');let start=null;
 board.addEventListener('touchstart',e=>{if(e.touches.length===1)start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
 board.addEventListener('touchend',e=>{if(!start||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;e.preventDefault();moveMaze(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:false});
 if(state.mazeWon)add('🔓 UNLOCK THE DREAM FILE',()=>go(6),'mint').id='maze-next';
 add('↻ RESET THIS MAZE',()=>{state.mazePos=[0,0];state.stamps=[];state.mazeWon=false;save();maze()},'secondary');
}
function drawMaze(){
 const board=$('#maze-board');if(!board)return;board.innerHTML='';
 mazeMap.forEach((line,r)=>[...line].forEach((cell,c)=>{
  const t=document.createElement('div');const player=state.mazePos[0]===r&&state.mazePos[1]===c;
  t.className='maze-tile'+(cell==='#'?' wall':'')+(cell==='J'?' goal':'')+(player?' player':'')+(state.stamps.includes(cell)?' got':'');
  const symbols={'#':'','S':'·','.':'·','1':'🛂','2':'🛂','3':'🛂','J':'⛩️'};
  t.textContent=player?'🧍':state.stamps.includes(cell)?'✓':symbols[cell];
  t.setAttribute('aria-label',player?'Your player':cell==='#'?'Wall':cell==='J'?'Japan dream gate':stampLabels[cell]?'Passport stamp '+stampLabels[cell]:'Path');
  board.append(t);
 }));
 const score=$('#stamp-score');if(score)score.textContent='🛂 '+state.stamps.length+'/3 STAMPS';
}
function moveMaze(dir){
 if(state.stage!==5||state.mazeWon)return;
 const delta={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[dir];if(!delta)return;
 const r=state.mazePos[0]+delta[0],c=state.mazePos[1]+delta[1];
 if(r<0||r>=6||c<0||c>=6||mazeMap[r][c]==='#'){beep(130,.09);$('#maze-note').textContent='BONK! That is a wall. Try another route. 🧱';return}
 state.mazePos=[r,c];const tile=mazeMap[r][c];
 if(stampLabels[tile]&&!state.stamps.includes(tile)){
  state.stamps.push(tile);beep(870,.12);$('#maze-note').textContent='STAMP COLLECTED: '+stampLabels[tile]+'! ('+state.stamps.length+'/3)';
 }else if(tile==='J'&&state.stamps.length!==3){beep(185,.12);$('#maze-note').textContent='Gate locked! Find all three passport stamps first. 🔒';
 }else if(tile==='J'){
  state.mazeWon=true;winSound();confetti();$('#maze-note').textContent='🇯🇵 DREAM UNLOCKED: JAPAN! Not a booked trip — our big adventure to dream about together.';
  if(!$('#maze-next'))add('🔓 UNLOCK THE DREAM FILE',()=>go(6),'mint').id='maze-next';
 }else{$('#maze-note').textContent='Keep exploring! '+state.stamps.length+'/3 passport stamps collected.'}
 save();drawMaze();
}
document.addEventListener('keydown',e=>{if(state.stage!==5||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;const tag=document.activeElement?.tagName;if(tag==='TEXTAREA'||tag==='INPUT')return;e.preventDefault();moveMaze(e.key.slice(5).toLowerCase())});
const wishes=[['Show me you care','Little reminders, even on ordinary days. 💗'],['Spend more time with me','Even doing absolutely nothing counts. 🫂'],['Plan another adventure','Morocco next, Japan someday — and all the little adventures between. ✈️'],['Surprise me sometimes','Something small, silly, or ridiculously romantic. 🎁'],['Make me laugh','Yes, even with terrible boyfriend jokes. 👾'],['My own secret request','I have something else in mind. ✍️']];
function finale(){page('SECRET FILE / UNLOCKED','PLOT TWIST!','THE FINAL BOSS IS… COMMUNICATION',`<p class="center"><span style="font-size:52px">🎮💌</span><br><b>YOU FOUND PANAGIOTIS!</b><br>And you unlocked our biggest shared dream: <b>JAPAN 🇯🇵</b>.<br><span class="small muted">Not a booked ticket. Just a promise to keep dreaming, and hopefully make it happen together.</span><br>But he has one question for you…</p><div class="request"><p class="pixel request-title">WHAT DO YOU WANT FROM ME?</p><p class="small center">Select as many answers as you like. No wrong answers. No pressure.</p></div><div id="wishes"></div><div class="request"><p class="pixel request-title">BONUS QUESTION: OUR JAPAN DREAM</p><p class="small">If we make it to Japan, what's the FIRST thing you want to do together?</p><div id="japan-choices" class="dream-options"></div></div><label for="message"><b>Bonus level:</b> Tell Panagiotis something in your own words (optional).</label><textarea id="message" class="field" maxlength="600" placeholder="I wish you would… / I love it when you…"></textarea>${gallery([0,1,2,3])}<div class="notice" id="share-note">Nothing is sent automatically. You'll choose whether to share your answers.</div>`);const list=$('#wishes');wishes.forEach(([title,desc],i)=>{const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=state.wishes.includes(i);input.onchange=()=>{state.wishes=input.checked?[...new Set([...state.wishes,i])]:state.wishes.filter(x=>x!==i);save();beep(700)};const words=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('span');small.textContent=desc;words.append(strong,small);label.append(input,words);list.append(label)});const dream=$('#japan-choices');japanChoices.forEach((choice,i)=>{const b=document.createElement('button');b.type='button';b.className='dream-choice'+(state.japanWish===choice?' selected':'');b.textContent=choice;b.setAttribute('aria-pressed',String(state.japanWish===choice));b.onclick=()=>{state.japanWish=state.japanWish===choice?'':choice;save();beep(790);dream.querySelectorAll('button').forEach((btn,j)=>{btn.classList.toggle('selected',state.japanWish===japanChoices[j]);btn.setAttribute('aria-pressed',String(state.japanWish===japanChoices[j]))})};dream.append(b)});$('#message').value=state.message;$('#message').oninput=e=>{state.message=e.target.value;save()};add('💌 GENERATE MY REQUEST',showRequest,'pink');add('↻ PLAY AGAIN',()=>{if(confirm('Reset everything, including your answers?')){state=fresh();go(0)}},'secondary')}
function resultText(){const selected=state.wishes.map(i=>'• '+wishes[i][0]);return `MISSION COMPLETE 👾💗\nDear Panagiotis,\n\nHere is what I want from you:\n${selected.length?selected.join('\n'):'I am keeping you guessing 😏'}${state.japanWish?'\n\nMy first Japan wish: '+state.japanWish:''}${state.message.trim()?'\n\nBonus request: '+state.message.trim():''}\n\n— Agent Kami 🕹️`}
function showRequest(){if(!state.wishes.length&&!state.japanWish&&!state.message.trim()){$('#share-note').textContent='Select an option or write your own request first. 💗';beep(180,.15);return}winSound();confetti();$('#result')?.remove();$('#share-generated')?.remove();$('#copy-generated')?.remove();const section=document.createElement('section');section.id='result';section.className='request';const heading=document.createElement('h2');heading.className='pixel';heading.style.cssText='font-size:12px;color:var(--mint)';heading.textContent='REQUEST UNLOCKED!';const text=document.createElement('p');text.style.whiteSpace='pre-wrap';text.style.overflowWrap='anywhere';text.textContent=resultText();section.append(heading,text);screen.append(section);add('📤 SHARE WITH PANAGIOTIS',share,'mint').id='share-generated';add('📋 COPY MY ANSWERS',copy,'secondary').id='copy-generated';$('#share-note').textContent='Tap SHARE and choose your chat, or COPY and paste the text. Nothing is sent automatically.';section.scrollIntoView({behavior:'smooth',block:'center'})}
async function copy(){try{await navigator.clipboard.writeText(resultText());$('#share-note').textContent='Copied! Paste it into your chat with Panagiotis. 💌'}catch(e){const t=document.createElement('textarea');t.value=resultText();document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();$('#share-note').textContent=ok?'Copied! Paste it into your chat. 💌':'Select and copy the text from the request box.'}}
async function share(){if(navigator.share){try{await navigator.share({title:'My Boyfriend Mission Results',text:resultText()});return}catch(e){if(e.name==='AbortError')return}}await copy()}
function confetti(){const root=$('#confetti');root.innerHTML='';for(let i=0;i<40;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#ff80b7','#ffdc80','#84edc4'][i%3];e.style.animationDelay=Math.random()*.5+'s';root.append(e)}setTimeout(()=>root.innerHTML='',4000)}
render();
</script>
